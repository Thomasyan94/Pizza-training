<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pizza Hut · Layer by layer</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<header class="nav">
  <a class="logo" href="#story" aria-label="Pizza Hut"><img id="logo" alt="Pizza Hut"></a>
  <div class="tools">
    <div class="lang" role="group" aria-label="Language"><button data-l="zh">中</button><button data-l="en">EN</button><button data-l="ms">BM</button></div>
    <button class="cartbtn" id="cartBtn" aria-label="Cart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg><span class="badge" id="badge">0</span></button>
  </div>
</header>
<main>
<section id="story"><div class="sticky" id="sticky">
  <div class="copy"><h1 data-t="h1"></h1><div class="caps" id="caps"></div><p class="hint" data-t="hint"></p><a class="cta" href="#menu" data-t="order"></a></div>
  <div class="stage" id="stage" role="img" aria-label="Pizza layers"></div>
</div></section>
<section id="menu"><h2 data-t="pick"></h2><p class="note" data-t="demo"></p><div class="cards" id="cards"></div></section>
</main>
<footer><p data-t="foot"></p><p><span data-t="hot"></span> <a href="tel:+601300882525">1-300-88-2525</a> · <a href="https://www.pizzahut.com.my" target="_blank" rel="noopener">pizzahut.com.my</a></p></footer>
<div id="ov"></div>
<aside id="drawer" aria-label="Cart" aria-hidden="true">
  <div class="dh"><h2 data-t="cart"></h2><button class="x" id="close" aria-label="Close">×</button></div>
  <div class="view c"><div class="items" id="items"></div><div class="tot"><span data-t="total"></span><span id="tot"></span></div><button class="btn w" id="go" data-t="checkout"></button></div>
  <form class="view f" id="form" novalidate>
    <label for="nm" data-t="name"></label><input id="nm" required autocomplete="name">
    <label for="ph" data-t="phone"></label><input id="ph" type="tel" required autocomplete="tel">
    <label for="nt" data-t="note"></label><textarea id="nt" rows="3"></textarea>
    <p class="note" id="err" role="alert"></p>
    <button class="btn w" type="submit" data-t="place"></button><button class="ghost" type="button" id="back" data-t="back"></button>
  </form>
  <div class="view d"><div class="empty pop"><h2 data-t="doneT"></h2><p data-t="doneP"></p><button class="btn" id="again" data-t="again"></button></div></div>
</aside>
<script type="module" src="./js/main.js"></script>
</body>
</html>
